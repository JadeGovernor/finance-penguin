<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 投资决策 Agent｜假设验证台</title>
    <style>
      #fp-gate{position:fixed;inset:0;z-index:99999;background:#0b1220;display:flex;align-items:center;justify-content:center;font-family:-apple-system,'PingFang SC',sans-serif}
      #fp-gate .box{background:#111a2c;border:1px solid #1f2b42;border-radius:14px;padding:36px 30px;width:320px;box-shadow:0 12px 40px rgba(0,0,0,.4);text-align:center}
      #fp-gate h1{font-size:20px;margin:0 0 6px;color:#f1f5f9}
      #fp-gate p{font-size:13px;color:#8b9bb4;margin:0 0 18px}
      #fp-gate input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #2a3a58;border-radius:9px;background:#0d1626;color:#e2e8f0;font-size:15px;outline:none}
      #fp-gate input:focus{border-color:#3b82f6}
      #fp-gate button{width:100%;margin-top:13px;padding:11px;border:0;border-radius:9px;background:#3b82f6;color:#fff;font-size:15px;cursor:pointer}
      #fp-gate button:hover{background:#2563eb}
      #fp-gate .err{color:#f87171;font-size:13px;margin-top:11px;min-height:18px}
    </style>
  </head>
  <body>
    <div id="fp-gate"><div class="box"><h1>🐧 Finance Penguin</h1><p>请输入访问密码</p>
      <form id="fp-form" autocomplete="off"><input id="fp-pass" type="password" placeholder="访问密码" />
      <button type="submit">进入</button></form><div class="err" id="fp-err"></div></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function(){
        var HASH = "f00d0e94577089bd5d28080bb3d42c62e74c4527887909b2370e222835db6603";
        var gate = document.getElementById("fp-gate");
        var form = document.getElementById("fp-form");
        var input = document.getElementById("fp-pass");
        var err = document.getElementById("fp-err");
        function unlock(){ if (gate) gate.style.display = "none"; }
        try { if (sessionStorage.getItem("fp_unlocked") === "1") { unlock(); return; } } catch (e) {}
        function hex(buf){ return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,"0"); }).join(""); }
        function sha256Hex(input) {
          var K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
          var H0 = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
          function rotr(x, n) { return ((x >>> n) | (x << (32 - n))) >>> 0; }
          var bytes = [];
          for (var i = 0; i < input.length; i++) bytes.push(input.charCodeAt(i) & 0xff);
          var bitLen = bytes.length * 8;
          bytes.push(0x80);
          while (bytes.length % 64 !== 56) bytes.push(0);
          var lenHi = Math.floor(bitLen / 0x100000000) >>> 0;
          var lenLo = bitLen >>> 0;
          for (var s = 3; s >= 0; s--) bytes.push((lenHi >>> (s * 8)) & 0xff);
          for (var s2 = 3; s2 >= 0; s2--) bytes.push((lenLo >>> (s2 * 8)) & 0xff);
          var words = [];
          for (var n = 0; n < bytes.length; n += 4) words.push(((bytes[n] << 24) | (bytes[n+1] << 16) | (bytes[n+2] << 8) | bytes[n+3]) >>> 0);
          var w = new Array(64);
          var H = H0.slice();
          for (var block = 0; block < words.length; block += 16) {
            for (var i2 = 0; i2 < 16; i2++) w[i2] = words[block + i2];
            for (var i3 = 16; i3 < 64; i3++) {
              var s0 = rotr(w[i3-15], 7) ^ rotr(w[i3-15], 18) ^ (w[i3-15] >>> 3);
              var s1 = rotr(w[i3-2], 17) ^ rotr(w[i3-2], 19) ^ (w[i3-2] >>> 10);
              w[i3] = (w[i3-16] + s0 + w[i3-7] + s1) >>> 0;
            }
            var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
            for (var t = 0; t < 64; t++) {
              var S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
              var ch = (e & f) ^ (~e & g);
              var temp1 = (h + S1 + ch + K[t] + w[t]) >>> 0;
              var S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
              var maj = (a & b) ^ (a & c) ^ (b & c);
              var temp2 = (S0 + maj) >>> 0;
              h = g; g = f; f = e; e = (d + temp1) >>> 0; d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
            }
            H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
            H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
          }
          var out = '';
          for (var o = 0; o < 8; o++) out += ('00000000' + H[o].toString(16)).slice(-8);
          return out;
        }
        function checkPass(v, done) {
          if (window.crypto && window.crypto.subtle) {
            crypto.subtle.digest("SHA-256", new TextEncoder().encode(v)).then(function(buf){ done(hex(buf) === HASH); });
          } else {
            done(sha256Hex(v) === HASH);
          }
        }
        form.addEventListener("submit", function(e){
          e.preventDefault();
          var v = (input.value || "").trim();
          if (!v) return;
          checkPass(v, function(ok){
            if (ok) { try { sessionStorage.setItem("fp_unlocked", "1"); } catch (e) {} unlock(); }
            else { err.textContent = "密码错误，请重试"; input.value = ""; input.focus(); }
          });
        });
      })();
    </script>
  </body>
</html>
